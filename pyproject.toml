[project]
name = "cv-learning"
version = "0.1.0"
description = "Learning project for crowd-density estimation from CCTV images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "imageio-ffmpeg>=0.6,<1",
    "h5py>=3.16.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

# Use the CUDA 12.6 builds on this Windows NVIDIA laptop. Explicit sources
# keep uv sync from replacing them with the CPU-only Windows PyPI builds.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]
